[project]
name = "pcgrl-jax"
version = "0.5.0"
description = "Procedural Content Generation via Reinforcement Learning (PCGRL), implemented end-to-end in JAX."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "NYU Game Innovation Lab", email = "sam.earle@nyu.edu" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "jax>=0.6,<0.7",
    "chex>=0.1.89",
    "distrax>=0.1.5",
    "flax>=0.10.6,<0.11",
    "gymnax>=0.0.9,<1.0",
    "optax>=0.2.5",
    "orbax-checkpoint>=0.11,<0.12",
    "tensorflow-probability>=0.25",
    "hydra-core>=1.3.2",
    "numpy>=2.0",
    "scipy",
    "pandas",
    "matplotlib",
    "imageio",
    "pillow",
    "pyyaml",
    "tqdm",
    "tabulate",
    "jinja2",
    "safetensors",
    "tensorboardx",
    "wandb",
    "submitit",
    "python-dotenv",
    "flask",
]

[project.optional-dependencies]
# NVIDIA GPU support: `uv sync --extra cuda12`
cuda12 = ["jax[cuda12]>=0.6,<0.7"]

[project.urls]
Repository = "https://github.com/smearle/pcgrl-jax"

[tool.uv]
# Scripts are run from the repository root; only the dependencies are installed.
package = false
